{% extends "crud/base.html" %}

{% block title %}Удалить запись{% endblock %}

{% block content %}
<h1>Удалить запись?</h1>
<p>Вы уверены, что хотите удалить «{{ item.title }}»?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{% url 'crud:item_list' %}">Отмена</a>
</form>
{% endblock %}
